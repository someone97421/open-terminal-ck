name: Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile sources
        run: python -m compileall -q open_terminal

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Import smoke test
        env:
          OPEN_TERMINAL_API_KEY: ci-smoke-test
        run: python -c "import open_terminal.main"

      - name: CLI help
        run: open-terminal --help

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
